name: Daily commercial lead search
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python search.py
      - name: Commit updated search results
        run: |
          git config user.name "contract-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunities.json
          git diff --cached --quiet || (git commit -m "Refresh contract search leads" && git push)
